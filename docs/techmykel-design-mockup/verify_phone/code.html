<body class="bg-bg-main text-on-surface font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Header / Contextual Back Action (Suppressed Global Nav) -->
<header class="w-full px-margin-mobile py-stack-md flex items-center h-16 shrink-0">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant/50 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-bg-main">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-start pt-8 px-margin-mobile pb-stack-lg w-full max-w-[480px] mx-auto">
<!-- Center Card (Surface 1) -->
<div class="bg-surface-container-lowest border border-border-light rounded-xl w-full p-6 shadow-[0_4px_8px_-4px_rgba(0,0,0,0.03)] flex flex-col items-center">
<div class="w-12 h-12 bg-primary-fixed rounded-full flex items-center justify-center mb-6 text-primary">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">phonelink_lock</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 text-center">
                Enter the code
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8 max-w-[280px]">
                We sent a 6-digit code to <span class="font-medium text-on-surface">0801 234 5678</span>
</p>
<!-- OTP Input Form -->
<form class="w-full flex flex-col items-center gap-stack-lg" id="otp-form">
<div class="flex gap-2 justify-center w-full" id="otp-container">
<input aria-label="Digit 1" class="w-12 h-14 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-border-light rounded-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 2" class="w-12 h-14 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-border-light rounded-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 3" class="w-12 h-14 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-border-light rounded-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 4" class="w-12 h-14 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-border-light rounded-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 5" class="w-12 h-14 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-border-light rounded-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 6" class="w-12 h-14 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-border-light rounded-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
<!-- Error Message (Hidden by default, structure provided) -->
<div class="hidden flex items-center gap-1.5 text-error w-full justify-center -mt-2" id="error-message">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-caption text-caption">Incorrect code. Please try again.</span>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary h-12 rounded-lg font-body-md text-body-md font-medium flex items-center justify-center hover:bg-surface-tint hover:shadow-md transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" id="verify-btn" type="button">
                    Verify &amp; continue
                </button>
</form>
<!-- Resend Action -->
<div class="mt-8 flex flex-col items-center">
<button class="font-body-md text-body-md text-primary font-medium hover:underline focus:outline-none rounded disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:no-underline" disabled="" id="resend-btn">
                    Resend code
                </button>
<p class="font-caption text-caption text-text-secondary mt-1" id="countdown-text">
                    Resend in <span id="countdown-timer">0:30</span>
</p>
</div>
</div>
</main>
<script>
        // Simple logic for OTP input auto-advance
        const inputs = document.querySelectorAll('#otp-container input');
        const errorMsg = document.getElementById('error-message');
        const verifyBtn = document.getElementById('verify-btn');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Clear error state on input
                errorMsg.classList.add('hidden');
                inputs.forEach(i => {
                    i.classList.remove('border-error', 'text-error', 'focus:border-error', 'focus:ring-error');
                    i.classList.add('border-border-light', 'focus:border-primary', 'focus:ring-primary');
                });

                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simulate Error State on click for demonstration purposes
        verifyBtn.addEventListener('click', () => {
            let filledCount = 0;
            inputs.forEach(input => { if(input.value) filledCount++; });
            
            // If less than 6 digits entered, show error style as mock functionality
            if (filledCount < 6) {
                errorMsg.classList.remove('hidden');
                inputs.forEach(i => {
                    i.classList.remove('border-border-light', 'focus:border-primary', 'focus:ring-primary');
                    i.classList.add('border-error', 'text-error', 'focus:border-error', 'focus:ring-error');
                });
            } else {
                // Success state simulation
                verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2 text-[20px]">progress_activity</span> Verifying...';
                verifyBtn.disabled = true;
                setTimeout(() => {
                    verifyBtn.innerHTML = 'Verify & continue';
                    verifyBtn.disabled = false;
                }, 1500);
            }
        });

        // Focus first input on load
        window.addEventListener('DOMContentLoaded', () => {
            if(inputs[0]) inputs[0].focus();
        });
    </script>
</body></html>
