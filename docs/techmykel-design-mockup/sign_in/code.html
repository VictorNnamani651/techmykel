<!DOCTYPE html>

<html class="light" lang="en"><head>

            theme: {

                    },
                    "borderRadius": {

<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Geist', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-bg-main min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Main Container -->
<main class="w-full max-w-[400px]">
<!-- Card Surface -->
<div class="bg-surface-container-lowest rounded-xl border border-border-light shadow-sm p-6 sm:p-8 relative overflow-hidden">
<!-- Subtle decorative background gradient (optional, keeps it corporate but modern) -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-primary to-secondary"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-8 pt-2">
<div class="w-12 h-12 bg-surface-container-low rounded-xl flex items-center justify-center mb-4 border border-border-light">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Sign in</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Access your PhoneFix Rewards account.</p>
</div>
<!-- Error State Panel (Active for demonstration) -->
<div class="bg-error-container/20 border border-error/50 rounded-lg p-3 mb-6 flex items-start gap-3">
<span class="material-symbols-outlined text-error mt-0.5" style="font-size: 18px;">error</span>
<p class="font-body-md text-body-md text-error">Invalid phone number or password.</p>
</div>
<!-- Login Form -->
<form class="space-y-5">
<!-- Phone Number Field -->
<div>
<label class="block font-body-md text-body-md text-on-surface mb-1.5 font-medium" for="phone">Phone number</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-lg">call</span>
<input aria-invalid="true" class="w-full bg-surface-container-lowest border border-error rounded-lg pl-10 pr-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-error focus:ring-1 focus:ring-error transition-colors" id="phone" placeholder="(555) 000-0000" type="tel" value="(555) 123-4567"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-body-md text-body-md text-on-surface mb-1.5 font-medium" for="password">Password</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-lg">key</span>
<input aria-invalid="true" class="w-full bg-surface-container-lowest border border-error rounded-lg pl-10 pr-12 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-error focus:ring-1 focus:ring-error transition-colors" id="password" placeholder="••••••••" type="password" value="wrongpassword123"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface p-1 rounded-full hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg block" id="toggle-icon">visibility</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="font-body-md text-body-md text-primary hover:underline" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-body-lg text-body-lg font-medium rounded-lg py-3 mt-4 transition-all duration-200 active:scale-[0.98] shadow-sm flex items-center justify-center gap-2" type="button">
                    Sign in
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New here? 
                <a class="text-primary font-medium hover:underline hover:text-surface-tint transition-colors" href="/signup">Create an account.</a>
</p>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
