<!-- Header -->
<div class="text-center mb-8 w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg mb-2">Create your account</h1>
<p class="font-body-md text-body-md text-text-secondary">Join us to manage your rewards efficiently.</p>
</div>
<!-- Form -->
<form action="#" class="w-full space-y-[20px]" method="POST">
<!-- Full Name -->
<div class="flex flex-col">
<label class="font-body-md text-body-md text-on-surface-variant mb-1 font-medium" for="fullName">Full Name</label>
<input class="w-full px-3 py-2 border border-border-light rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface bg-surface-bright transition-colors" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Phone Number -->
<div class="flex flex-col">
<label class="font-body-md text-body-md text-on-surface-variant mb-1 font-medium" for="phone">Phone Number</label>
<input class="w-full px-3 py-2 border border-border-light rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface bg-surface-bright transition-colors" id="phone" name="phone" placeholder="0801 234 5678" required="" type="tel"/>
</div>
<!-- Password -->
<div class="flex flex-col relative">
<label class="font-body-md text-body-md text-on-surface-variant mb-1 font-medium" for="password">Password</label>
<div class="relative">
<input class="w-full px-3 py-2 pr-10 border border-border-light rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface bg-surface-bright transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-secondary hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-2 flex flex-col space-y-4">
<button class="w-full bg-primary text-on-primary rounded-lg py-3 font-body-md text-body-md font-semibold hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                    Continue
                </button>
<p class="font-caption text-caption text-text-secondary text-center">
                    We'll send you an OTP to verify your phone number.
                </p>
</div>
</form>
<!-- Footer -->
<div class="mt-8 text-center w-full border-t border-border-light pt-6">
<p class="font-body-md text-body-md text-text-secondary">
                Already have an account? 
                <a class="text-primary hover:text-on-primary-fixed-variant font-medium transition-colors" href="#">Sign in</a>
</p>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
